<!DOCTYPE html>
<html lang="en"><head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100 Days Fitness Challenge — Leaderboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#080810;font-family:'DM Sans',sans-serif;color:#eee;}

    .lb-root{
      min-height:100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%,rgba(255,107,53,.15) 0%,transparent 60%),
        repeating-linear-gradient(0deg,transparent,transparent 60px,rgba(255,255,255,.015) 60px,rgba(255,255,255,.015) 61px),
        repeating-linear-gradient(90deg,transparent,transparent 60px,rgba(255,255,255,.015) 60px,rgba(255,255,255,.015) 61px);
      padding:0 0 60px;
    }
    .hero{text-align:center;padding:40px 24px 28px;}
    .hero-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#FF6B35;border:1px solid rgba(255,107,53,.4);padding:5px 16px;border-radius:100px;margin-bottom:14px;}
    .hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(44px,10vw,88px);line-height:.92;letter-spacing:2px;background:linear-gradient(135deg,#fff 40%,#FF6B35 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;}
    .hero-sub{font-size:13px;color:#888;letter-spacing:1px;}

    .stats-bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 24px 28px;}
    .stat-chip{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 20px;text-align:center;min-width:106px;}
    .stat-chip-val{font-family:'Bebas Neue',sans-serif;font-size:30px;color:#FF6B35;line-height:1;}
    .stat-chip-label{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:1px;margin-top:3px;}

    .section-label{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#555;padding:0 24px;margin-bottom:14px;}

    /* ── Activity category block ── */
    .category-block{margin-bottom:40px;}
    .category-header{display:flex;align-items:center;gap:12px;padding:0 24px;margin-bottom:18px;}
    .category-icon{font-size:28px;}
    .category-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;}
    .category-title.walk{color:#69FF47;}
    .category-title.run{color:#00E5FF;}
    .category-title.cycle{color:#FF6B35;}
    .category-divider{flex:1;height:1px;background:rgba(255,255,255,.07);}
    .category-count{font-size:11px;color:#555;letter-spacing:1px;}

    /* ── Podium ── */
    .podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:0 20px 32px;}
    .podium-slot{flex:1;max-width:175px;display:flex;flex-direction:column;align-items:center;}
    .podium-card{width:100%;border-radius:16px 16px 0 0;padding:18px 14px 14px;text-align:center;transition:transform .2s;}
    .podium-card:hover{transform:translateY(-4px);}
    .podium-card.first {background:linear-gradient(160deg,#2a1f00,#1a1200);border:1px solid rgba(255,215,0,.25);box-shadow:0 0 40px rgba(255,215,0,.1);padding-bottom:28px;}
    .podium-card.second{background:linear-gradient(160deg,#1a1a1a,#0f0f0f);border:1px solid rgba(192,192,192,.2);}
    .podium-card.third {background:linear-gradient(160deg,#1c1000,#100a00);border:1px solid rgba(205,127,50,.2);}
    .podium-medal{font-size:26px;margin-bottom:7px;}
    .podium-name{font-size:12px;font-weight:700;color:#fff;margin-bottom:3px;line-height:1.2;}
    .podium-km{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#FF6B35;line-height:1;}
    .podium-km-unit{font-size:10px;color:#666;margin-bottom:5px;}
    .podium-days{font-size:10px;color:#888;}
    .podium-base{width:100%;border-radius:0 0 8px 8px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;display:flex;align-items:center;justify-content:center;}
    .podium-base.first {background:#FFD700;color:#000;height:52px;}
    .podium-base.second{background:#909090;color:#000;height:38px;}
    .podium-base.third {background:#7B4F2B;color:#fff;height:26px;}

    .podium-empty{text-align:center;padding:24px;color:#333;font-size:12px;letter-spacing:1px;text-transform:uppercase;}

    /* ── Full rankings list ── */
    .list-wrap{padding:0 14px;margin-bottom:12px;}
    .list-item{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:13px 14px;margin-bottom:8px;transition:background .15s,border-color .15s;animation:fadeUp .3s ease both;}
    .list-item:hover{background:rgba(255,255,255,.055);border-color:rgba(255,107,53,.2);}
    .rank-badge{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:18px;background:rgba(255,255,255,.06);color:#888;flex-shrink:0;}
    .list-name{font-size:14px;font-weight:600;color:#f0f0f0;margin-bottom:2px;}
    .list-meta{font-size:11px;color:#666;display:flex;gap:10px;flex-wrap:wrap;}
    .list-right{text-align:right;}
    .list-km{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#FF6B35;line-height:1;}
    .list-km-unit{font-size:10px;color:#666;}
    .progress-track{width:100%;height:4px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:5px;overflow:hidden;}
    .progress-fill{height:100%;border-radius:2px;transition:width .6s ease;}
    .status-pill{display:inline-block;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;border-radius:100px;margin-top:5px;}

    .legend{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:24px 24px 0;}
    .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:#777;}
    .legend-dot{width:8px;height:8px;border-radius:50%;}

    .loading{text-align:center;padding:80px 24px;color:#555;font-size:14px;}
    .loading-spinner{width:32px;height:32px;border:3px solid rgba(255,107,53,.2);border-top-color:#FF6B35;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
    @keyframes spin{to{transform:rotate(360deg);}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  </style>
</head>
<body>

<div class="lb-root">
  <div class="hero">
    <div class="hero-tag">🔥 Live Leaderboard</div>
    <div class="hero-title">100 DAYS<br>FITNESS</div>
    <div class="hero-sub">START DATE: 1 JUN 2026 &nbsp;•&nbsp; WALK / RUN / CYCLE</div>
  </div>

  <div class="stats-bar" id="stats-bar">
    <div class="loading"><div class="loading-spinner"></div>Loading leaderboard…</div>
  </div>

  <!-- Three category sections injected by JS -->
  <div id="categories-section"></div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#FFD700"></div>Champion ≥90d</div>
    <div class="legend-item"><div class="legend-dot" style="background:#00E5FF"></div>Elite ≥70d</div>
    <div class="legend-item"><div class="legend-dot" style="background:#69FF47"></div>Active ≥50d</div>
    <div class="legend-item"><div class="legend-dot" style="background:#FF9800"></div>Started ≥1d</div>
    <div class="legend-item"><div class="legend-dot" style="background:#888"></div>Pending</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  // ── PASTE YOUR FIREBASE CONFIG HERE ──────────────────────────────────────
  const firebaseConfig = {
  apiKey: "AIzaSyCrxTZEUB5x8VolI31091hqrZKvtdnbkmM",
   authDomain: "fitness-leaderboard-ed631.firebaseapp.com",
   databaseURL: "https://fitness-leaderboard-ed631-default-rtdb.firebaseio.com",
   projectId: "fitness-leaderboard-ed631",
   storageBucket: "fitness-leaderboard-ed631.firebasestorage.app",
   messagingSenderId: "861678454829",
   appId: "1:861678454829:web:f375e12cf6970d7d6cd0a4"
  };
  // ─────────────────────────────────────────────────────────────────────────

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  const CHALLENGE_DAYS = 100;

  const CATEGORIES = [
    { key: 'Walking', icon: '🚶', label: 'Walking',  cls: 'walk' },
    { key: 'Running', icon: '🏃', label: 'Running',  cls: 'run'  },
    { key: 'Cycling', icon: '🚴', label: 'Cycling',  cls: 'cycle'},
  ];

  function getStatus(days) {
    if (days >= 90) return { label:"Champion", color:"#FFD700", bg:"#2a2000", icon:"🏆" };
    if (days >= 70) return { label:"Elite",    color:"#00E5FF", bg:"#001a1f", icon:"🥇" };
    if (days >= 50) return { label:"Active",   color:"#69FF47", bg:"#001a00", icon:"💪" };
    if (days >= 1)  return { label:"Started",  color:"#FF9800", bg:"#1a0d00", icon:"🌱" };
    return               { label:"Pending",  color:"#888",    bg:"#111",    icon:"⏳" };
  }
  function getMedal(rank) { return rank===1?"🥇":rank===2?"🥈":"🥉"; }
  function pcColor(pct)   { return pct>=90?"#FFD700":pct>=70?"#00E5FF":pct>=50?"#69FF47":"#FF6B35"; }
  function esc(str)       { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function sortBy(arr)    { return [...arr].sort((a,b)=>b.km-a.km||b.days-a.days); }

  function renderPodium(top3) {
    if (top3.length === 0) return `<div class="podium-empty">No participants yet</div>`;
    const slots = top3.length >= 3
      ? [[top3[1],2,"second","2ND"],[top3[0],1,"first","1ST"],[top3[2],3,"third","3RD"]]
      : top3.map((p,i)=>[[p,i+1,["first","second","third"][i],["1ST","2ND","3RD"][i]]]).flat();

    return `<div class="podium">${slots.map(([p,rnk,cls,lbl])=>{
      const pct=Math.min(100,Math.round(p.days/CHALLENGE_DAYS*100));
      return `<div class="podium-slot">
        <div class="podium-card ${cls}">
          <div class="podium-medal">${getMedal(rnk)}</div>
          <div class="podium-name">${esc(p.name)}</div>
          <div class="podium-km">${p.km}</div>
          <div class="podium-km-unit">KM TOTAL</div>
          <div class="podium-days">${p.days} days</div>
          <div class="progress-track" style="margin-top:9px"><div class="progress-fill" style="width:${pct}%;background:linear-gradient(90deg,#FF6B35,#FF9F68)"></div></div>
        </div>
        <div class="podium-base ${cls}">${lbl}</div>
      </div>`;
    }).join('')}</div>`;
  }

  function renderList(sorted) {
    if (sorted.length === 0) return '';
    return `<div class="list-wrap">${sorted.map((p,i)=>{
      const rank=i+1, st=getStatus(p.days), pct=Math.min(100,Math.round(p.days/CHALLENGE_DAYS*100));
      const bs = rank<=3?`background:${rank===1?"rgba(255,215,0,.15)":rank===2?"rgba(192,192,192,.12)":"rgba(205,127,50,.12)"};color:${rank===1?"#FFD700":rank===2?"#C0C0C0":"#CD7F32"}`:'';
      return `<div class="list-item" style="animation-delay:${i*.04}s">
        <div class="rank-badge" style="${bs}">${rank<=3?getMedal(rank):rank}</div>
        <div>
          <div class="list-name">${esc(p.name)}</div>
          <div class="list-meta"><span>${p.days}/${CHALLENGE_DAYS} days</span><span>🎟 ${p.tokens} token${p.tokens!==1?'s':''} used</span></div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${pcColor(pct)}"></div></div>
        </div>
        <div class="list-right">
          <div class="list-km">${p.km}</div>
          <div class="list-km-unit">KM</div>
          <span class="status-pill" style="background:${st.bg};color:${st.color};border:1px solid ${st.color}33">${st.icon} ${st.label}</span>
        </div>
      </div>`;
    }).join('')}</div>`;
  }

  function renderAll(participants) {
    // Stats bar
    const totalKm    = participants.reduce((a,p)=>a+p.km,0);
    const avgDays    = participants.length ? Math.round(participants.reduce((a,p)=>a+p.days,0)/participants.length) : 0;
    const tokensUsed = participants.reduce((a,p)=>a+p.tokens,0);
    document.getElementById('stats-bar').innerHTML = [
      {val:participants.length,      label:"Participants"},
      {val:totalKm.toLocaleString(), label:"Total KM"},
      {val:avgDays,                  label:"Avg Days"},
      {val:tokensUsed,               label:"Tokens Used"},
    ].map(x=>`<div class="stat-chip"><div class="stat-chip-val">${x.val}</div><div class="stat-chip-label">${x.label}</div></div>`).join('');

    // Categories
    document.getElementById('categories-section').innerHTML = CATEGORIES.map(cat => {
      const group  = sortBy(participants.filter(p => p.activity === cat.key));
      const top3   = group.slice(0,3);
      return `<div class="category-block">
        <div class="category-header">
          <span class="category-icon">${cat.icon}</span>
          <span class="category-title ${cat.cls}">${cat.label}</span>
          <div class="category-divider"></div>
          <span class="category-count">${group.length} ATHLETE${group.length!==1?'S':''}</span>
        </div>
        <div class="section-label" style="padding-left:24px">TOP 3 PODIUM</div>
        ${renderPodium(top3)}
        ${group.length > 0 ? `<div class="section-label" style="margin-top:4px">FULL RANKINGS</div>` : ''}
        ${renderList(group)}
      </div>`;
    }).join('');
  }

  onValue(ref(db, 'participants'), (snapshot) => {
    const raw = snapshot.val();
    const participants = raw ? Object.values(raw) : [];
    renderAll(participants);
  });
</script>

</body></html>
