<!DOCTYPE html>
<html lang="en"><head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100 Days Fitness Challenge — Leaderboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#080810;font-family:'DM Sans',sans-serif;color:#eee;}

    .lb-root{
      min-height:100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%,rgba(255,107,53,.15) 0%,transparent 60%),
        repeating-linear-gradient(0deg,transparent,transparent 60px,rgba(255,255,255,.015) 60px,rgba(255,255,255,.015) 61px),
        repeating-linear-gradient(90deg,transparent,transparent 60px,rgba(255,255,255,.015) 60px,rgba(255,255,255,.015) 61px);
      padding:0 0 32px;
    }

    /* ── Hero (poster style) ── */
    .hero{text-align:center;padding:28px 24px 20px;}
    .hero-starting{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#CC5522;background:rgba(180,80,30,.18);border:1px solid rgba(200,90,40,.35);padding:6px 18px;border-radius:100px;margin-bottom:18px;}
    .hero-starting-dot{width:7px;height:7px;border-radius:50%;background:#FF6B35;animation:pulse 1.6s ease-in-out infinite;}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(.8);}}
    .hero-100{font-family:'Bebas Neue',sans-serif;font-size:clamp(80px,22vw,160px);line-height:.85;color:#fff;letter-spacing:2px;display:block;}
    .hero-days{font-family:'Bebas Neue',sans-serif;font-size:clamp(52px,15vw,110px);line-height:.85;color:#FF6B35;letter-spacing:4px;display:block;}
    .hero-fitness{font-family:'Bebas Neue',sans-serif;font-size:clamp(36px,10vw,72px);line-height:1;color:#fff;letter-spacing:8px;display:block;margin-bottom:16px;}
    .hero-quote{font-family:'Georgia',serif;font-style:italic;font-size:clamp(13px,3.5vw,17px);color:#5bb8e8;margin-bottom:10px;line-height:1.4;}
    .hero-community{font-size:10px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#555;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px;}
    .hero-community-line{width:28px;height:1px;background:#333;}
    .hero-dates{display:inline-flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:100px;padding:10px 22px;font-size:13px;font-weight:600;color:#ccc;margin-bottom:16px;}
    .hero-dates-sep{width:28px;height:1px;background:#444;}
    .hero-pills{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;}
    .hero-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:100px;padding:8px 18px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#ccc;}

    /* ── Category tabs (horizontal scroll) ── */
    .cat-tabs{display:flex;gap:6px;padding:12px 14px 0;overflow-x:auto;scrollbar-width:none;}
    .cat-tabs::-webkit-scrollbar{display:none;}
    .cat-tab{flex-shrink:0;padding:7px 16px;border-radius:100px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:1px solid rgba(255,255,255,.1);background:transparent;color:#555;transition:all .2s;}
    .cat-tab.active-walk{background:rgba(105,255,71,.12);border-color:rgba(105,255,71,.4);color:#69FF47;}
    .cat-tab.active-run {background:rgba(0,229,255,.12);border-color:rgba(0,229,255,.4);color:#00E5FF;}
    .cat-tab.active-cycle{background:rgba(255,107,53,.15);border-color:rgba(255,107,53,.4);color:#FF6B35;}
    .cat-tab:hover:not([class*="active"]){border-color:rgba(255,255,255,.2);color:#aaa;}

    /* ── Category panel ── */
    .cat-panel{display:none;padding:14px 0 0;}
    .cat-panel.active{display:block;}

    .cat-header{display:flex;align-items:center;gap:10px;padding:0 16px 12px;}
    .cat-icon{font-size:22px;}
    .cat-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;}
    .cat-title.walk{color:#69FF47;}
    .cat-title.run {color:#00E5FF;}
    .cat-title.cycle{color:#FF6B35;}
    .cat-divider{flex:1;height:1px;background:rgba(255,255,255,.06);}
    .cat-count{font-size:10px;color:#444;letter-spacing:1px;text-transform:uppercase;}

    /* ── Podium (compact 3-col) ── */
    .podium{display:flex;align-items:flex-end;justify-content:center;gap:6px;padding:0 12px 20px;}
    .podium-slot{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;}
    .podium-card{width:100%;border-radius:14px 14px 0 0;padding:12px 10px 10px;text-align:center;transition:transform .2s;}
    .podium-card:hover{transform:translateY(-3px);}
    .podium-card.first {background:linear-gradient(160deg,#2a1f00,#1a1200);border:1px solid rgba(255,215,0,.25);box-shadow:0 0 30px rgba(255,215,0,.08);padding-bottom:20px;}
    .podium-card.second{background:linear-gradient(160deg,#1a1a1a,#0f0f0f);border:1px solid rgba(192,192,192,.2);}
    .podium-card.third {background:linear-gradient(160deg,#1c1000,#100a00);border:1px solid rgba(205,127,50,.2);}
    .podium-medal{font-size:20px;margin-bottom:5px;}
    .podium-name{font-size:11px;font-weight:700;color:#fff;margin-bottom:2px;line-height:1.2;}
    .podium-km{font-family:'Bebas Neue',sans-serif;font-size:24px;color:#FF6B35;line-height:1;}
    .podium-km-unit{font-size:9px;color:#555;margin-bottom:3px;}
    .podium-days{font-size:9px;color:#777;}
    .podium-base{width:100%;border-radius:0 0 6px 6px;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;display:flex;align-items:center;justify-content:center;}
    .podium-base.first {background:#FFD700;color:#000;height:44px;}
    .podium-base.second{background:#909090;color:#000;height:32px;}
    .podium-base.third {background:#7B4F2B;color:#fff;height:22px;}
    .podium-empty{text-align:center;padding:20px;color:#333;font-size:11px;letter-spacing:1px;text-transform:uppercase;}

    /* ── Rankings list (compact) ── */
    .section-label{font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#444;padding:0 16px;margin-bottom:10px;}
    .list-wrap{padding:0 10px;margin-bottom:8px;}
    .list-item{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:10px 12px;margin-bottom:6px;transition:background .15s,border-color .15s;animation:fadeUp .3s ease both;}
    .list-item:hover{background:rgba(255,255,255,.05);border-color:rgba(255,107,53,.2);}
    .rank-badge{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:16px;background:rgba(255,255,255,.06);color:#777;flex-shrink:0;}
    .list-name{font-size:13px;font-weight:600;color:#f0f0f0;margin-bottom:1px;}
    .list-meta{font-size:10px;color:#555;display:flex;gap:8px;flex-wrap:wrap;}
    .list-right{text-align:right;}
    .list-km{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#FF6B35;line-height:1;}
    .list-km-unit{font-size:9px;color:#555;}
    .progress-track{width:100%;height:3px;background:rgba(255,255,255,.07);border-radius:2px;margin-top:4px;overflow:hidden;}
    .progress-fill{height:100%;border-radius:2px;transition:width .6s ease;}
    .status-pill{display:inline-block;font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:100px;margin-top:4px;}
    .token-row{display:flex;align-items:center;gap:5px;margin-top:4px;}
    .token-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
    .token-dot.used{background:#E74C3C;box-shadow:0 0 4px rgba(231,76,60,.5);}
    .token-dot.left{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);}
    .token-label{font-size:9px;color:#555;letter-spacing:.5px;}
    .token-label.all-used{color:#E74C3C;font-weight:700;}

    /* ── Legend (compact) ── */
    .legend{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:16px 16px 0;}
    .legend-item{display:flex;align-items:center;gap:5px;font-size:10px;color:#555;}
    .legend-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}

    .loading{text-align:center;padding:60px 24px;color:#555;font-size:13px;}
    .loading-spinner{width:28px;height:28px;border:2px solid rgba(255,107,53,.2);border-top-color:#FF6B35;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
    @keyframes spin{to{transform:rotate(360deg);}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  </style>
</head>
<body>

<div class="lb-root">

  <!-- Hero -->
  <div class="hero">
    <div class="hero-starting"><span class="hero-starting-dot"></span>Starting 1 June 2026</div>
    <div>
      <span class="hero-100">100</span>
      <span class="hero-days">DAYS</span>
      <span class="hero-fitness">FITNESS</span>
    </div>
    <div class="hero-quote">"Lets move together, stronger everyday!"</div>
    <div class="hero-community">
      <span class="hero-community-line"></span>
      Keya Apartments Community
      <span class="hero-community-line"></span>
    </div>
    <div class="hero-dates">
      <span>1 June 2026</span>
      <span class="hero-dates-sep"></span>
      <span>9 September 2026</span>
    </div>
    <div class="hero-pills">
      <span class="hero-pill">🚶 Walk 2 KM+</span>
      <span class="hero-pill">🏃 Run 2 KM+</span>
      <span class="hero-pill">🚴 Cycle 5 KM+</span>
    </div>
  </div>

  <!-- Leaderboard divider -->
  <div style="text-align:center;padding:20px 0 4px;">
    <span style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#FF6B35;border:1px solid rgba(255,107,53,.3);padding:5px 18px;border-radius:100px;">🏆 Live Leaderboard</span>
  </div>

  <!-- Activity tabs -->
  <div class="cat-tabs">
    <button class="cat-tab active-walk" onclick="switchCat('walk',this)">🚶 Walking</button>
    <button class="cat-tab" onclick="switchCat('run',this)">🏃 Running</button>
    <button class="cat-tab" onclick="switchCat('cycle',this)">🚴 Cycling</button>
  </div>

  <!-- Panels (one per activity) -->
  <div id="panel-walk" class="cat-panel active">
    <div class="loading"><div class="loading-spinner"></div></div>
  </div>
  <div id="panel-run" class="cat-panel">
    <div class="loading"><div class="loading-spinner"></div></div>
  </div>
  <div id="panel-cycle" class="cat-panel">
    <div class="loading"><div class="loading-spinner"></div></div>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#FFD700"></div>Champion ≥90d</div>
    <div class="legend-item"><div class="legend-dot" style="background:#00E5FF"></div>Elite ≥70d</div>
    <div class="legend-item"><div class="legend-dot" style="background:#69FF47"></div>Active ≥50d</div>
    <div class="legend-item"><div class="legend-dot" style="background:#FF9800"></div>Started ≥1d</div>
    <div class="legend-item"><div class="legend-dot" style="background:#555"></div>Pending</div>
  </div>

</div>

<script>
  // Tab switching
  function switchCat(key, btn) {
    document.querySelectorAll('.cat-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.cat-tab').forEach(t => { t.className = 'cat-tab'; });
    document.getElementById('panel-' + key).classList.add('active');
    btn.classList.add('active-' + key);
  }
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  // ── PASTE YOUR FIREBASE CONFIG HERE ──────────────────────────────────────
  const firebaseConfig = {
    apiKey: "AIzaSyCrxTZEUB5x8VolI31091hqrZKvtdnbkmM",
    authDomain: "fitness-leaderboard-ed631.firebaseapp.com",
    databaseURL: "https://fitness-leaderboard-ed631-default-rtdb.firebaseio.com",
    projectId: "fitness-leaderboard-ed631",
    storageBucket: "fitness-leaderboard-ed631.firebasestorage.app",
    messagingSenderId: "861678454829",
    appId: "1:861678454829:web:f375e12cf6970d7d6cd0a4"
  };
  // ─────────────────────────────────────────────────────────────────────────

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  const CHALLENGE_DAYS = 100;

  const CATEGORIES = [
    { key:'walk',  dbKey:'Walk/Run', icon:'🚶', label:'Walking', cls:'walk' },
    { key:'run',   dbKey:'Running',  icon:'🏃', label:'Running', cls:'run'  },
    { key:'cycle', dbKey:'Cycling',  icon:'🚴', label:'Cycling', cls:'cycle'},
  ];

  function getStatus(days) {
    if (days >= 90) return { label:"Champion", color:"#FFD700", bg:"#2a2000", icon:"🏆" };
    if (days >= 70) return { label:"Elite",    color:"#00E5FF", bg:"#001a1f", icon:"🥇" };
    if (days >= 50) return { label:"Active",   color:"#69FF47", bg:"#001a00", icon:"💪" };
    if (days >= 1)  return { label:"Started",  color:"#FF9800", bg:"#1a0d00", icon:"🌱" };
    return               { label:"Pending",  color:"#888",    bg:"#111",    icon:"⏳" };
  }
  function getMedal(r) { return r===1?"🥇":r===2?"🥈":"🥉"; }
  function pcColor(p)  { return p>=90?"#FFD700":p>=70?"#00E5FF":p>=50?"#69FF47":"#FF6B35"; }
  function esc(s)      { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function sortBy(arr) { return [...arr].sort((a,b)=>b.km-a.km||b.days-a.days); }

  function renderPodium(top3) {
    if (!top3.length) return `<div class="podium-empty" style="color:#444;font-size:11px;letter-spacing:1px;padding:18px 0">⏳ Podium unlocks once KM &amp; days are logged</div>`;
    const slots = top3.length >= 3
      ? [[top3[1],2,"second","2ND"],[top3[0],1,"first","1ST"],[top3[2],3,"third","3RD"]]
      : top3.map((p,i)=>[[p,i+1,["first","second","third"][i],["1ST","2ND","3RD"][i]]]).flat();
    return `<div class="podium">${slots.map(([p,rnk,cls,lbl])=>{
      const pct=Math.min(100,Math.round(p.days/CHALLENGE_DAYS*100));
      return `<div class="podium-slot">
        <div class="podium-card ${cls}">
          <div class="podium-medal">${getMedal(rnk)}</div>
          <div class="podium-name">${esc(p.name)}</div>
          <div class="podium-km">${p.km}</div>
          <div class="podium-km-unit">KM</div>
          <div class="podium-days">${p.days} days</div>
          <div class="progress-track" style="margin-top:7px"><div class="progress-fill" style="width:${pct}%;background:linear-gradient(90deg,#FF6B35,#FF9F68)"></div></div>
        </div>
        <div class="podium-base ${cls}">${lbl}</div>
      </div>`;
    }).join('')}</div>`;
  }

  function renderList(sorted) {
    if (!sorted.length) return '';
    return `<div class="section-label">FULL RANKINGS</div>
    <div class="list-wrap">${sorted.map((p,i)=>{
      const rank=i+1, st=getStatus(p.days), pct=Math.min(100,Math.round(p.days/CHALLENGE_DAYS*100));
      const bs=rank<=3?`background:${rank===1?"rgba(255,215,0,.15)":rank===2?"rgba(192,192,192,.12)":"rgba(205,127,50,.12)"};color:${rank===1?"#FFD700":rank===2?"#C0C0C0":"#CD7F32"}`:'';
      return `<div class="list-item" style="animation-delay:${i*.04}s">
        <div class="rank-badge" style="${bs}">${rank<=3?getMedal(rank):rank}</div>
        <div>
          <div class="list-name">${esc(p.name)}</div>
          <div class="list-meta"><span>${p.days}/${CHALLENGE_DAYS} days</span></div>
          <div class="token-row">${Array.from({length:6},(_,i)=>`<div class="token-dot ${i<p.tokens?'used':'left'}"></div>`).join('')}<span class="token-label ${p.tokens>=6?'all-used':''}">${p.tokens>=6?'⚠️ No tokens left':`${p.tokens}/6 tokens used`}</span></div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${pcColor(pct)}"></div></div>
        </div>
        <div class="list-right">
          <div class="list-km">${p.km}</div>
          <div class="list-km-unit">KM</div>
          <span class="status-pill" style="background:${st.bg};color:${st.color};border:1px solid ${st.color}33">${st.icon} ${st.label}</span>
        </div>
      </div>`;
    }).join('')}</div>`;
  }

  function renderPanel(cat, group) {
    // Only include participants with km > 0 or days > 0 in podium
    const podiumGroup = group.filter(p => p.km > 0 || p.days > 0);
    const top3 = podiumGroup.slice(0,3);
    return `
      <div class="cat-header">
        <span class="cat-icon">${cat.icon}</span>
        <span class="cat-title ${cat.cls}">${cat.label}</span>
        <div class="cat-divider"></div>
        <span class="cat-count">${group.length} ATHLETE${group.length!==1?'S':''}</span>
      </div>
      <div class="section-label">TOP 3 PODIUM</div>
      ${renderPodium(top3)}
      ${renderList(group)}
    `;
  }

  onValue(ref(db, 'participants'), (snapshot) => {
    const raw = snapshot.val();
    const all = raw ? Object.values(raw) : [];

    CATEGORIES.forEach(cat => {
      // Walk/Run maps to walking tab; Running maps to running tab
      let group;
      if (cat.key === 'walk') {
        group = sortBy(all.filter(p => p.activity === 'Walking' || p.activity === 'Walk/Run'));
      } else if (cat.key === 'run') {
        group = sortBy(all.filter(p => p.activity === 'Running'));
      } else {
        group = sortBy(all.filter(p => p.activity === 'Cycling'));
      }
      document.getElementById('panel-' + cat.key).innerHTML = renderPanel(cat, group);
    });
  });
</script>

</body></html>
