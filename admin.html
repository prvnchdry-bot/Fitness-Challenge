<!DOCTYPE html>
<html lang="en"><head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — 100 Days Fitness Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#080810;font-family:'DM Sans',sans-serif;color:#eee;min-height:100vh;}

    .topbar{background:#0f0f1a;border-bottom:1px solid rgba(255,107,53,.2);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .topbar-title{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#FF6B35;letter-spacing:2px;}
    .topbar-badge{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;background:rgba(255,107,53,.15);border:1px solid rgba(255,107,53,.3);color:#FF6B35;padding:4px 12px;border-radius:100px;}
    .topbar-link{font-size:11px;color:#555;text-decoration:none;border:1px solid rgba(255,255,255,.1);padding:6px 14px;border-radius:8px;transition:all .2s;}
    .topbar-link:hover{border-color:rgba(255,107,53,.4);color:#FF6B35;}

    .page{padding:24px 16px 60px;max-width:960px;margin:0 auto;}

    .add-card{background:rgba(255,255,255,.03);border:1px dashed rgba(255,107,53,.3);border-radius:16px;padding:20px;margin-bottom:24px;}
    .add-card-title{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#FF6B35;margin-bottom:14px;letter-spacing:1px;}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
    @media(max-width:480px){.form-grid{grid-template-columns:1fr;}}
    .fg{display:flex;flex-direction:column;gap:4px;}
    .fg label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#555;}
    .fg input,.fg select{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 11px;font-family:'DM Sans',sans-serif;font-size:13px;color:#eee;outline:none;width:100%;}
    .fg input:focus,.fg select:focus{border-color:rgba(255,107,53,.5);background:rgba(255,107,53,.05);}
    .fg select option{background:#1a1a2e;color:#eee;}
    .btn-add{width:100%;background:#FF6B35;color:#000;border:none;border-radius:10px;padding:11px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.5px;transition:opacity .15s,transform .1s;}
    .btn-add:hover{opacity:.88;transform:translateY(-1px);}
    .btn-add:disabled{opacity:.4;cursor:not-allowed;transform:none;}

    .section-title{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#fff;letter-spacing:1px;margin-bottom:14px;}
    .section-sub{font-size:12px;color:#555;margin-top:2px;margin-bottom:16px;}

    .table-wrap{overflow-x:auto;border-radius:14px;border:1px solid rgba(255,255,255,.07);}
    table{width:100%;border-collapse:collapse;min-width:700px;}
    thead tr{background:#0f0f1a;}
    thead th{padding:11px 14px;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#555;text-align:left;border-bottom:1px solid rgba(255,255,255,.07);}
    tbody tr{border-bottom:1px solid rgba(255,255,255,.04);transition:background .15s;}
    tbody tr:last-child{border-bottom:none;}
    tbody tr:hover{background:rgba(255,255,255,.03);}
    tbody td{padding:11px 14px;font-size:13px;color:#ccc;vertical-align:middle;}
    .td-name{font-weight:600;color:#f0f0f0;}

    .inline-input{background:transparent;border:1px solid rgba(255,107,53,.4);border-radius:6px;padding:4px 8px;font-family:'DM Sans',sans-serif;font-size:13px;color:#eee;outline:none;width:100%;}
    .inline-input:focus{background:rgba(255,107,53,.06);}
    .inline-select{background:#1a1a2e;border:1px solid rgba(255,107,53,.4);border-radius:6px;padding:4px 8px;font-family:'DM Sans',sans-serif;font-size:12px;color:#eee;outline:none;}

    .btn-icon{background:none;border:none;cursor:pointer;font-size:15px;padding:4px 6px;border-radius:6px;transition:background .15s;line-height:1;}
    .btn-icon:hover{background:rgba(255,255,255,.08);}
    .btn-save{color:#69FF47;}.btn-cancel{color:#888;}.btn-edit{color:#00E5FF;}.btn-del{color:#E74C3C;}

    .status-pill{display:inline-block;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;border-radius:100px;}

    .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e1e2e;border:1px solid rgba(255,107,53,.3);color:#eee;padding:12px 24px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:999;white-space:nowrap;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    .toast.success{border-color:rgba(105,255,71,.4);color:#69FF47;}
    .toast.error{border-color:rgba(231,76,60,.4);color:#E74C3C;}

    .empty-state{text-align:center;padding:48px 24px;color:#444;font-size:13px;}
    .empty-icon{font-size:36px;margin-bottom:10px;}

    .loading{text-align:center;padding:48px 24px;color:#555;font-size:13px;}
    .loading-spinner{width:24px;height:24px;border:2px solid rgba(255,107,53,.2);border-top-color:#FF6B35;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
    @keyframes spin{to{transform:rotate(360deg);}}
  </style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-title">⚙️ Admin Panel</div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <span class="topbar-badge">🔒 Private</span>
    <a class="topbar-link" href="index.html" target="_blank">👁 View Leaderboard</a>
  </div>
</div>

<div class="page">

  <!-- Add Participant -->
  <div class="add-card">
    <div class="add-card-title">+ New Participant</div>
    <div class="form-grid">
      <div class="fg" style="grid-column:1/-1">
        <label>Full Name</label>
        <input id="f-name" placeholder="e.g. Rahul Sharma">
      </div>
      <div class="fg">
        <label>Activity Type</label>
        <select id="f-activity">
          <option>Walk/Run</option>
          <option>Cycling</option>
          <option>Both</option>
        </select>
      </div>
      <div class="fg">
        <label>Tokens Used</label>
        <select id="f-tokens">
          <option value="0">0</option><option value="1">1</option>
          <option value="2">2</option><option value="3">3</option>
        </select>
      </div>
      <div class="fg">
        <label>Total KM Logged</label>
        <input id="f-km" type="number" placeholder="e.g. 120" min="0" step="0.1">
      </div>
      <div class="fg">
        <label>Days Active (0–100)</label>
        <input id="f-days" type="number" placeholder="e.g. 45" min="0" max="100">
      </div>
    </div>
    <button class="btn-add" id="btn-add" onclick="addParticipant()">➕ ADD TO CHALLENGE</button>
  </div>

  <!-- Participant Table -->
  <div class="section-title">All Participants</div>
  <div class="section-sub" id="participant-count">Loading…</div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Activity</th>
          <th>Total KM</th>
          <th>Days Active</th>
          <th>Tokens Used</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="data-tbody">
        <tr><td colspan="8"><div class="loading"><div class="loading-spinner"></div>Connecting to database…</div></td></tr>
      </tbody>
    </table>
  </div>

</div>

<div class="toast" id="toast"></div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, push, remove, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  // ── PASTE YOUR FIREBASE CONFIG HERE ──────────────────────────────────────
  const firebaseConfig = {
    apiKey: "AIzaSyCrxTZEUB5x8VolI31091hqrZKvtdnbkmM",
    authDomain: "http://fitness-leaderboard-ed631.firebaseapp.com",
    databaseURL: "https://fitness-leaderboard-ed631-default-rtdb.firebaseio.com",
    projectId: "fitness-leaderboard-ed631",
    storageBucket: "fitness-leaderboard-ed631.firebasestorage.app",
    messagingSenderId: "861678454829",
    appId: "1:861678454829:web:f375e12cf6970d7d6cd0a4"
  };
  // ─────────────────────────────────────────────────────────────────────────

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  const participantsRef = ref(db, 'participants');

  const CHALLENGE_DAYS = 100;
  let participants = {};   // keyed by Firebase push ID
  let editingKey = null;

  // ── Toast ─────────────────────────────────────────────────────────────────
  function toast(msg, type='success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast show ${type}`;
    setTimeout(() => { el.className = 'toast'; }, 2800);
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function getStatus(days) {
    if (days >= 90) return { label:"Champion", color:"#FFD700", bg:"#2a2000", icon:"🏆" };
    if (days >= 70) return { label:"Elite",    color:"#00E5FF", bg:"#001a1f", icon:"🥇" };
    if (days >= 50) return { label:"Active",   color:"#69FF47", bg:"#001a00", icon:"💪" };
    if (days >= 1)  return { label:"Started",  color:"#FF9800", bg:"#1a0d00", icon:"🌱" };
    return               { label:"Pending",  color:"#888",    bg:"#111",    icon:"⏳" };
  }
  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function sortedEntries() {
    return Object.entries(participants).sort((a,b) => b[1].km-a[1].km || b[1].days-a[1].days);
  }

  // ── Render table ──────────────────────────────────────────────────────────
  function renderTable() {
    const tbody = document.getElementById('data-tbody');
    const entries = sortedEntries();
    const count = entries.length;
    document.getElementById('participant-count').textContent =
      count === 0 ? 'No participants yet — add one above.' : `${count} participant${count!==1?'s':''} in the challenge`;

    if (count === 0) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">📋</div>No participants yet. Add one above!</div></td></tr>`;
      return;
    }

    tbody.innerHTML = entries.map(([key, p], i) => {
      const st = getStatus(p.days);
      if (editingKey === key) {
        return `<tr id="row-${key}">
          <td style="color:#555">${i+1}</td>
          <td><input class="inline-input" id="e-name" value="${esc(p.name)}" style="min-width:130px"/></td>
          <td><select class="inline-select" id="e-activity">
            ${['Walk/Run','Cycling','Both'].map(o=>`<option${p.activity===o?' selected':''}>${o}</option>`).join('')}
          </select></td>
          <td><input class="inline-input" id="e-km" type="number" value="${p.km}" style="width:80px"/></td>
          <td><input class="inline-input" id="e-days" type="number" value="${p.days}" min="0" max="100" style="width:70px"/></td>
          <td><select class="inline-select" id="e-tokens">
            ${[0,1,2,3].map(v=>`<option value="${v}"${p.tokens===v?' selected':''}>${v}</option>`).join('')}
          </select></td>
          <td><span class="status-pill" style="background:${st.bg};color:${st.color};border:1px solid ${st.color}33">${st.icon} ${st.label}</span></td>
          <td>
            <button class="btn-icon btn-save" onclick="window._saveEdit('${key}')" title="Save">✅</button>
            <button class="btn-icon btn-cancel" onclick="window._cancelEdit()" title="Cancel">✖</button>
          </td>
        </tr>`;
      }
      return `<tr>
        <td style="color:#555">${i+1}</td>
        <td class="td-name">${esc(p.name)}</td>
        <td><span style="color:#888;font-size:12px">${p.activity}</span></td>
        <td><span style="color:#FF6B35;font-weight:700">${p.km}</span> <span style="color:#555;font-size:11px">km</span></td>
        <td>${p.days} <span style="color:#555;font-size:11px">/ 100</span></td>
        <td><span style="color:#aaa">${p.tokens}</span></td>
        <td><span class="status-pill" style="background:${st.bg};color:${st.color};border:1px solid ${st.color}33">${st.icon} ${st.label}</span></td>
        <td>
          <button class="btn-icon btn-edit" onclick="window._startEdit('${key}')" title="Edit">✏️</button>
          <button class="btn-icon btn-del"  onclick="window._deleteP('${key}')"   title="Delete">🗑</button>
        </td>
      </tr>`;
    }).join('');
  }

  // ── Add participant ───────────────────────────────────────────────────────
  window.addParticipant = async function() {
    const name = document.getElementById('f-name').value.trim();
    const km   = parseFloat(document.getElementById('f-km').value)  || 0;
    const days = parseInt(document.getElementById('f-days').value)  || 0;
    if (!name) { toast('Please enter a name.','error'); return; }

    const btn = document.getElementById('btn-add');
    btn.disabled = true; btn.textContent = 'Saving…';

    try {
      await push(participantsRef, {
        name,
        activity: document.getElementById('f-activity').value,
        km, days,
        tokens: parseInt(document.getElementById('f-tokens').value)
      });
      document.getElementById('f-name').value  = '';
      document.getElementById('f-km').value    = '';
      document.getElementById('f-days').value  = '';
      document.getElementById('f-tokens').value = '0';
      toast(`✅ ${name} added to the challenge!`);
    } catch(e) {
      toast('Error saving. Check Firebase config.','error');
    } finally {
      btn.disabled = false; btn.textContent = '➕ ADD TO CHALLENGE';
    }
  };

  // ── Edit ──────────────────────────────────────────────────────────────────
  window._startEdit = function(key) { editingKey = key; renderTable(); setTimeout(()=>document.getElementById('e-name')?.focus(),50); };
  window._cancelEdit = function()   { editingKey = null; renderTable(); };

  window._saveEdit = async function(key) {
    const p = participants[key];
    if (!p) return;
    const updated = {
      name:     document.getElementById('e-name').value.trim() || p.name,
      activity: document.getElementById('e-activity').value,
      km:       parseFloat(document.getElementById('e-km').value)   || 0,
      days:     parseInt(document.getElementById('e-days').value)   || 0,
      tokens:   parseInt(document.getElementById('e-tokens').value) || 0,
    };
    try {
      await update(ref(db, `participants/${key}`), updated);
      editingKey = null;
      toast('✅ Changes saved!');
    } catch(e) {
      toast('Error saving changes.','error');
    }
  };

  // ── Delete ────────────────────────────────────────────────────────────────
  window._deleteP = async function(key) {
    const name = participants[key]?.name || 'this participant';
    if (!confirm(`Remove ${name} from the challenge?`)) return;
    try {
      await remove(ref(db, `participants/${key}`));
      toast(`🗑 ${name} removed.`);
    } catch(e) {
      toast('Error deleting participant.','error');
    }
  };

  // ── Enter key on add form ─────────────────────────────────────────────────
  ['f-name','f-km','f-days'].forEach(id => {
    document.getElementById(id)?.addEventListener('keydown', e => { if(e.key==='Enter') window.addParticipant(); });
  });

  // ── Real-time listener ────────────────────────────────────────────────────
  onValue(participantsRef, (snapshot) => {
    participants = snapshot.val() || {};
    renderTable();
  });
</script>

</body></html>
